name: Daily Auto Scrape and OCR Update

on:
  schedule:
    # 00:30 UTC daily (08:30 Beijing time)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  auto-crawl-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pillow rapidocr_onnxruntime

      - name: Run auto pipeline
        run: |
          python auto_pipeline.py

      - name: Commit and push updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add images/ data/
          
          if git diff --staged --quiet; then
            echo "No price updates found today. Exiting."
          else
            echo "Changes detected. Pushing to main branch..."
            git commit -m "Auto: Daily update price images and CSV data [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
