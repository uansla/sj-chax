name: 自动编译并发布 EXE 工具


on:

  push:
    tags:
      - 'v*'


  workflow_dispatch:

    inputs:

      version_tag:

        description: '发布版本号 (如 v1.0.2)'

        required: true

        default: 'v1.0.2'



jobs:


  build-windows:


    runs-on: windows-2025


    permissions:

      contents: write



    steps:


      # ============================
      # 1. 拉取代码
      # ============================

      - name: 1. 拉取仓库代码

        uses: actions/checkout@v5




      # ============================
      # 2. Python环境
      # ============================

      - name: 2. 配置 Python 环境

        uses: actions/setup-python@v6

        with:

          python-version: "3.11"




      # ============================
      # 3. 安装PyInstaller
      # ============================

      - name: 3. 安装打包工具

        run: |

          python -m pip install --upgrade pip

          pip install pyinstaller





      # ============================
      # 4. 编译EXE
      # ============================

      - name: 4. 编译 Windows EXE

        shell: pwsh

        run: |

          pyinstaller -F -w --name PhoneSearch phone_search.py





      # ============================
      # 5. 组装发布包
      # ============================

      - name: 5. 组装安装包

        shell: python

        run: |

          import os

          import shutil

          import zipfile



          app_dir = "PhoneSearch_App"

          zip_name = "PhoneSearch_Windows.zip"



          print("开始创建发布目录")



          if os.path.exists(app_dir):

              shutil.rmtree(app_dir)



          os.makedirs(

              os.path.join(app_dir, "data"),

              exist_ok=True

          )




          # -----------------------
          # 复制EXE
          # -----------------------

          exe_file = os.path.join(

              "dist",

              "PhoneSearch.exe"

          )


          if not os.path.exists(exe_file):

              raise FileNotFoundError(

                  "没有找到 dist/PhoneSearch.exe"

              )



          shutil.copy2(

              exe_file,

              os.path.join(

                  app_dir,

                  "手机回收价格秒查工具.exe"

              )

          )


          print("EXE复制完成")




          # -----------------------
          # 复制CSV
          # -----------------------

          data_dir = "data"

          csv_count = 0



          if not os.path.exists(data_dir):

              raise FileNotFoundError(

                  "项目中没有找到data目录"

              )



          for file in os.listdir(data_dir):


              if file.lower().endswith(".csv"):


                  shutil.copy2(

                      os.path.join(data_dir,file),

                      os.path.join(

                          app_dir,

                          "data",

                          file

                      )

                  )


                  csv_count += 1


                  print(

                      "复制CSV:",

                      file

                  )




          if csv_count == 0:


              raise Exception(

                  "data目录里面没有CSV文件"

              )



          print(

              f"共复制 {csv_count} 个CSV文件"

          )





          # -----------------------
          # 创建ZIP
          # -----------------------

          with zipfile.ZipFile(

              zip_name,

              "w",

              zipfile.ZIP_DEFLATED

          ) as zf:



              for root, dirs, files in os.walk(app_dir):


                  for file in files:


                      full_path = os.path.join(

                          root,

                          file

                      )


                      zf.write(

                          full_path,

                          os.path.relpath(

                              full_path,

                              app_dir

                          )

                      )



          print(

              "ZIP创建完成:",

              zip_name

          )





      # ============================
      # 6. 发布Release
      # ============================


      - name: 6. 自动发布 Release


        shell: bash


        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}



        run: |


          TAG="${{ github.event.inputs.version_tag }}"



          if [ -z "$TAG" ]; then

              TAG="${{ github.ref_name }}"

          fi



          echo "当前版本: $TAG"




          # 如果Release存在

          if gh release view "$TAG" >/dev/null 2>&1

          then


              echo "Release已存在，上传文件"


              gh release upload \

              "$TAG" \

              PhoneSearch_Windows.zip \

              --clobber



          else


              echo "创建新的Release"


              gh release create \

              "$TAG" \

              PhoneSearch_Windows.zip \

              --title "手机回收价格秒查工具 $TAG" \

              --notes "自动构建绿色版"



          fi
