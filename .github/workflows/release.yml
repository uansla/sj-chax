name: 自动编译并发布 EXE 工具


on:

  push:

    tags:

      - 'v*'


  workflow_dispatch:

    inputs:

      version_tag:

        description: '发布版本号 (如 v1.0.2)'

        required: true

        default: 'v1.0.2'



jobs:


  build-windows:


    runs-on: windows-2025


    permissions:

      contents: write



    steps:



      - name: 1. 拉取仓库代码

        uses: actions/checkout@v5




      - name: 2. 配置 Python 环境

        uses: actions/setup-python@v6

        with:

          python-version: "3.11"




      - name: 3. 安装打包工具

        run: |

          python -m pip install --upgrade pip

          pip install pyinstaller




      - name: 4. 编译 Windows EXE

        run: |

          pyinstaller -F -w --name "PhoneSearch" phone_search.py




      - name: 5. 组装安装包

        shell: python

        run: |

          import os

          import shutil

          import zipfile



          app_dir = "PhoneSearch_App"

          zip_name = "PhoneSearch_Windows.zip"



          if os.path.exists(app_dir):

              shutil.rmtree(app_dir)



          os.makedirs(

              os.path.join(app_dir,"data"),

              exist_ok=True

          )



          exe_src=os.path.join(

              "dist",

              "PhoneSearch.exe"

          )



          if not os.path.exists(exe_src):

              raise FileNotFoundError(

                  "没有找到 PhoneSearch.exe"

              )



          shutil.copy2(

              exe_src,

              os.path.join(

                  app_dir,

                  "手机回收价格秒查工具.exe"

              )

          )



          print(
              "✅ EXE复制完成"
          )



          data_src="data"

          file_count=0



          if os.path.exists(data_src):


              for f in os.listdir(data_src):


                  if f.lower().endswith(".csv"):


                      shutil.copy2(

                          os.path.join(data_src,f),

                          os.path.join(app_dir,"data",f)

                      )


                      file_count+=1


                      print(
                          "CSV:",
                          f
                      )



          if file_count==0:

              raise Exception(

                  "data目录没有找到CSV文件"

              )



          print(

              f"共复制 {file_count} 个CSV"

          )




          with zipfile.ZipFile(

              zip_name,

              "w",

              zipfile.ZIP_DEFLATED

          ) as zf:



              for root,dirs,files in os.walk(app_dir):


                  for f in files:


                      full=os.path.join(root,f)


                      zf.write(

                          full,

                          os.path.relpath(

                              full,

                              app_dir

                          )

                      )



          print(

              "🎉 ZIP创建成功"

          )





      - name: 6. 自动发布 Release


        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}



        shell: bash


        run: |


          TAG="${{ github.event.inputs.version_tag }}"


          if [ -z "$TAG" ]; then

              TAG="${{ github.ref_name }}"

          fi



          echo "发布版本:$TAG"




          if gh release view "$TAG" >/dev/null 2>&1

          then


              echo "Release存在，上传附件"


              gh release upload \

              "$TAG" \

              PhoneSearch_Windows.zip \

              --clobber



          else


              echo "创建Release"


              gh release create \

              "$TAG" \

              PhoneSearch_Windows.zip \

              --title "手机回收价格秒查工具 $TAG" \

              --notes "自动构建绿色版"



          fi
