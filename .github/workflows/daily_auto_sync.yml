name: Daily Auto Scrape and OCR Sync

on:
  schedule:
    # 每天北京时间 08:30 (UTC 00:30) 运行
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 pillow rapidocr_onnxruntime

      - name: 执行自动化爬虫与 OCR 流水线
        run: |
          # 确保调用的是最新的 10 列标准脚本
          python auto_pipeline.py

      - name: 提交并推送数据更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加图片和数据目录
          git add images/*.jpg
          git add data/*.csv
          git add data/price_history.json
          
          if git diff --staged --quiet; then
            echo "今日价格无变动，跳过提交。"
          else
            echo "检测到数据变动，正在同步到仓库..."
            git commit -m "Auto: 自动同步最新回收报价 [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
