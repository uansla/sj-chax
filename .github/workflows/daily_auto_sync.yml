name: Daily Auto Scrape and OCR Sync

on:
  schedule:
    # 每天北京时间 08:30 (UTC 00:30) 运行
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  auto-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装环境依赖
        run: |
          pip install requests beautifulsoup4 pillow rapidocr_onnxruntime

      - name: 执行 10 列标准自动化流水线
        run: |
          python auto_pipeline.py

      - name: 提交并推送数据更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 核心修复：直接 add 整个目录，如果目录不存在则创建一个空的，避免报错
          mkdir -p data images
          git add data/
          git add images/
          
          # 检查是否有变动
          if git diff --staged --quiet; then
            echo "今日价格数据无变动，跳过提交。"
          else
            echo "检测到数据变动，正在同步到仓库..."
            git commit -m "Auto: 同步最新回收报价 (10列标准) [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
