name: Build and Publish Windows and Debian Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号，例如 v1.2.0'
        required: true
        default: 'v1.0.0'

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖并检查源码
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m py_compile phone_search.py auto_pipeline.py

      - name: 打包 Windows EXE
        run: python -m PyInstaller --clean --noconfirm -F -w --name SearchTool phone_search.py

      - name: 整理 Windows 发布包
        shell: python
        run: |
          import os
          import shutil
          import zipfile

          app_dir = 'PhonePriceSearch_Windows'
          os.makedirs(app_dir, exist_ok=True)
          shutil.copy2('dist/SearchTool.exe', os.path.join(app_dir, '手机回收价格秒查工具.exe'))
          with open(os.path.join(app_dir, '使用说明.txt'), 'w', encoding='utf-8') as f:
              f.write('手机回收价格秒查工具（Windows）\n\n将自己的 data 文件夹放在 EXE 同级目录。程序支持离线查询本地 CSV；勾选“联网更新”后会同步官网报价。\n')
          with zipfile.ZipFile('PhonePriceSearch_Windows.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(app_dir):
                  for name in files:
                      path = os.path.join(root, name)
                      zf.write(path, os.path.relpath(path, app_dir))

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v6
        with:
          name: PhonePriceSearch_Windows
          path: PhonePriceSearch_Windows.zip
          if-no-files-found: error

  build-debian:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    container:
      image: debian:${{ matrix.debian }}
    steps:
      - name: 安装系统构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-venv python3-tk \
            build-essential binutils libgl1 libglib2.0-0

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python 打包依赖
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m py_compile phone_search.py auto_pipeline.py

      - name: 打包 Debian 可执行程序
        run: .venv/bin/python -m PyInstaller --clean --noconfirm --onefile --name phone-price-search phone_search.py

      - name: 整理 Debian 发布包
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          set -eu
          app_dir="PhonePriceSearch_Debian${DEBIAN_VERSION}"
          mkdir -p "$app_dir"
          cp dist/phone-price-search "$app_dir/手机回收价格秒查工具"
          chmod +x "$app_dir/手机回收价格秒查工具"
          cat > "$app_dir/使用说明.txt" <<'EOF'
          手机回收价格秒查工具（Debian）

          1. 解压发布包，在终端进入解压目录。
          2. 运行：./手机回收价格秒查工具
          3. 将自己的 data 文件夹放在程序同级目录。程序支持离线查询本地 CSV；勾选“联网更新”后会同步官网报价。
          4. 需要桌面图形会话（X11 或 Wayland/XWayland）。
          EOF
          archive="PhonePriceSearch_Debian${DEBIAN_VERSION}.tar.gz"
          tar -czf "$archive" "$app_dir"

      - name: 上传 Debian 构建产物
        uses: actions/upload-artifact@v6
        with:
          name: PhonePriceSearch_Debian${{ matrix.debian }}
          path: PhonePriceSearch_Debian${{ matrix.debian }}.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: 确定发布版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "错误：版本号必须类似 v1.2.0"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "手机回收报价工具 $TAG" \
            --notes "提供 Windows EXE、Debian 12 和 Debian 13 版本。发布包只含软件本体，不含用户行情数据。将自己的 data 文件夹放在程序同级目录即可离线查询，也可在软件中开启联网更新。" \
            || gh release upload "$TAG" release-assets/* --clobber
