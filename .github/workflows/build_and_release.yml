name: Build and Publish Windows App

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      PYTHONUTF8: 1  # 强制 Python 在 Windows 终端使用 UTF-8 编码

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包工具
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 使用 PyInstaller 打包 EXE
        run: |
          # 使用英文名编译，避免 spec 文件路径编码问题
          pyinstaller -F -w --name "SearchTool" phone_search.py

      - name: 自动化整合发布包
        shell: python
        run: |
          import os, shutil, zipfile

          app_dir = "Release_Package"
          zip_name = "PhonePriceSearch_Windows.zip"

          if os.path.exists(app_dir): shutil.rmtree(app_dir)
          os.makedirs(os.path.join(app_dir, "data"), exist_ok=True)

          # 1. 复制并重命名主程序
          exe_src = "dist/SearchTool.exe"
          if os.path.exists(exe_src):
              shutil.copy2(exe_src, os.path.join(app_dir, "手机回收价格秒查工具.exe"))
          
          # 2. 复制 data 目录下的 CSV
          data_path = "data"
          if os.path.exists(data_path):
              for f in os.listdir(data_path):
                  if f.lower().endswith(".csv"):
                      shutil.copy2(os.path.join(data_path, f), os.path.join(app_dir, "data", f))

          # 3. 创建 ZIP 压缩包
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(app_dir):
                  for f in files:
                      full_path = os.path.join(root, f)
                      rel_path = os.path.relpath(full_path, app_dir)
                      zf.write(full_path, rel_path)
          
          print("Build successfully assembled into zip.")

      - name: 创建 GitHub Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then
            TAG="${{ github.ref_name }}"
          fi
          
          echo "Target Release Version: $TAG"

          gh release create "$TAG" PhonePriceSearch_Windows.zip \
            --title "手机回收报价工具 $TAG" \
            --notes "包含最新的 10 列标准价格数据格式。下载解压后，双击 EXE 运行。" \
            || gh release upload "$TAG" PhonePriceSearch_Windows.zip --clobber
