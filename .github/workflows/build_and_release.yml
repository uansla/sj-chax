name: Build and Publish Windows App

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      PYTHONUTF8: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包工具
        run: |
          pip install pyinstaller

      - name: 使用 PyInstaller 打包 EXE
        run: |
          # 打包为单文件 SearchTool.exe
          pyinstaller -F -w --name "SearchTool" phone_search.py

      - name: 自动化整合发布包
        shell: python
        run: |
          import os, shutil, zipfile

          app_dir = "Recycle_Tool_App"
          zip_name = "PhonePriceSearch_Windows.zip"

          if os.path.exists(app_dir): shutil.rmtree(app_dir)
          os.makedirs(app_dir, exist_ok=True)
          os.makedirs(os.path.join(app_dir, "data"), exist_ok=True)

          # 1. 复制 EXE
          shutil.copy2("dist/SearchTool.exe", os.path.join(app_dir, "手机回收价格秒查工具.exe"))
          
          # 2. 复制 data 目录下的所有 CSV（如果存在）
          data_path = "data"
          if os.path.exists(data_path):
              for f in os.listdir(data_path):
                  if f.lower().endswith(".csv"):
                      shutil.copy2(os.path.join(data_path, f), os.path.join(app_dir, "data", f))

          # 3. 创建 ZIP (重点：必须相对于 app_dir 打包，确保解压后是一个文件夹)
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(app_dir):
                  for f in files:
                      full_path = os.path.join(root, f)
                      # 保持压缩包内的相对路径结构
                      rel_path = os.path.relpath(full_path, app_dir)
                      zf.write(full_path, rel_path)
          
          print("Packaging complete.")

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          [ -z "$TAG" ] || [ "$TAG" == "null" ] && TAG="${{ github.ref_name }}"
          
          gh release create "$TAG" PhonePriceSearch_Windows.zip \
            --title "手机回收报价工具 $TAG" \
            --notes "修正了路径识别问题，新增打开文件夹和手动刷新功能。请解压后直接运行 EXE。" \
            || gh release upload "$TAG" PhonePriceSearch_Windows.zip --clobber
