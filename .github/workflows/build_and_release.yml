name: Build and Publish Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '发布版本号，例如 v1.2.0'
        required: true
        default: 'v1.0.0'

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装打包工具
        run: python -m pip install --upgrade pip pyinstaller requests beautifulsoup4

      - name: 构建前检查
        shell: python
        run: |
          import py_compile

          py_compile.compile('phone_search.py', doraise=True)
          py_compile.compile('auto_pipeline.py', doraise=True)
          print('程序源码检查完成；行情数据由用户本地保存，不参与打包。')

      - name: 使用 PyInstaller 打包 EXE
        run: python -m PyInstaller --clean -F -w --name "SearchTool" phone_search.py

      - name: 自动化整合发布包
        shell: python
        run: |
          import os
          import shutil
          import zipfile

          app_dir = 'Recycle_Tool_App'
          zip_name = 'PhonePriceSearch_Windows.zip'

          if os.path.exists(app_dir):
              shutil.rmtree(app_dir)
          if os.path.exists(zip_name):
              os.remove(zip_name)

          # 只发布软件本体；用户行情 CSV 不上传 GitHub，也不放进安装包。
          shutil.copy2('dist/SearchTool.exe', os.path.join(app_dir, '手机回收价格秒查工具.exe'))

          # 额外放入说明文件，避免用户不知道目录结构。
          with open(os.path.join(app_dir, '使用说明.txt'), 'w', encoding='utf-8') as f:
              f.write(
                  '手机回收价格秒查工具\n\n'
                  '1. 将你自己的 data 文件夹放在“手机回收价格秒查工具.exe”同级目录。\n'
                  '2. data 文件夹内按品牌建立子文件夹，并放入报价 CSV。\n'
                  '3. 软件支持离线查询本地 CSV；勾选“联网更新”后会自动同步官网报价。\n'
                  '4. 可在软件中选择报价日期，再输入手机型号搜索价格。\n'
              )

          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(app_dir):
                  for name in files:
                      full_path = os.path.join(root, name)
                      rel_path = os.path.relpath(full_path, app_dir)
                      zf.write(full_path, rel_path)

          print(f'软件发布包构建完成：{zip_name}（不含用户行情数据）。')

      - name: 确定发布版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "错误：版本号必须类似 v1.2.0"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "使用版本号：$TAG"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" PhonePriceSearch_Windows.zip \
            --title "手机回收报价工具 $TAG" \
            --notes "发布包只含软件本体，不含用户行情数据。用户可将自己的 data 文件夹放在 EXE 同级目录，支持日期筛选、型号查询及联网/离线切换。" \
            || gh release upload "$TAG" PhonePriceSearch_Windows.zip --clobber
