name: Build and Release Windows App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller -F -w --name "PhonePriceSearch" phone_search.py

      - name: Assemble release package
        shell: python
        run: |
          import os, shutil, zipfile

          app_dir = "PhonePriceSearch_App"
          zip_name = "PhonePriceSearch_Windows.zip"

          if os.path.exists(app_dir):
              shutil.rmtree(app_dir)
          os.makedirs(os.path.join(app_dir, "data"), exist_ok=True)

          exe_src = os.path.join("dist", "PhonePriceSearch.exe")
          if os.path.exists(exe_src):
              shutil.copy2(exe_src, os.path.join(app_dir, "PhonePriceSearch.exe"))
              print("Copied executable: PhonePriceSearch.exe")
          else:
              raise FileNotFoundError("PhonePriceSearch.exe not found in dist/")

          data_src = "data"
          file_count = 0
          if os.path.exists(data_src):
              for f in os.listdir(data_src):
                  if f.lower().endswith(".csv"):
                      shutil.copy2(os.path.join(data_src, f), os.path.join(app_dir, "data", f))
                      file_count += 1
                      print(f"Packed CSV: {f}")
          print(f"data directory assembled: {file_count} CSV files total")

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(app_dir):
                  for f in files:
                      full_path = os.path.join(root, f)
                      rel_path = os.path.relpath(full_path, ".")
                      zf.write(full_path, rel_path)
          print("PhonePriceSearch_Windows.zip archive created successfully")

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PhonePriceSearch_Windows
          path: PhonePriceSearch_Windows.zip

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "Target Release Tag: $TAG"

          gh release create "$TAG" PhonePriceSearch_Windows.zip \
            --title "Phone Price Search Tool $TAG" \
            --notes "Standalone Windows Release: Includes PhonePriceSearch.exe and external data/ directory with all brand CSV price tables." \
            || gh release upload "$TAG" PhonePriceSearch_Windows.zip --clobber

          echo "Release publication completed successfully"
